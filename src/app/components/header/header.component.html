<header
    class="bg-brand-bg/80 backdrop-blur-md shadow-sm border-b border-stone-200/50 fixed top-0 left-0 right-0 z-40 px-6 h-24 flex items-center justify-between">

    <div class="flex items-center gap-3 font-sans select-none">
        <span class="text-xs font-semibold tracking-wider uppercase text-text-muted hidden sm:inline">
            {{ themeService.isDarkMode() ? 'Mode Nuit' : 'Mode Jour' }}
        </span>

        <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" [checked]="themeService.isDarkMode()" (change)="themeService.toggleTheme()"
                class="sr-only peer">

            <div class="w-11 h-6 bg-stone-200 rounded-full transition-colors duration-200
                    peer-focus:ring-2 peer-focus:ring-poppy/40
                    peer-checked:bg-poppy">
            </div>

            <div class="absolute top-0.5 left-0.5 bg-white w-5 h-5 rounded-full shadow-sm transition-transform duration-200 flex items-center justify-center
                    peer-checked:translate-x-full">
                @if (themeService.isDarkMode()) {
                <span class="text-[10px] leading-none">🌙</span>
                } @else {
                <span class="text-[10px] leading-none">☀️</span>
                }
            </div>
        </label>
    </div>

    <div class="w-16 hidden md:block shrink-0"></div>

    <div class="flex items-center gap-4 md:gap-6 mx-auto">
        <img src="assets/logo.png" alt="Logo Poppy in the sky"
            class="h-16 w-16 md:h-22 md:w-22 object-contain select-none pointer-events-none drop-shadow-sm" />

        <h1 class="text-3xl md:text-5xl font-serif font-semibold tracking-wide text-poppy">
            {{ config.title }}
        </h1>
    </div>

    <button (click)="onToggle()"
        class="text-text-main hover:text-poppy focus:outline-none z-50 p-2 transition-colors shrink-0 w-16 flex justify-end"
        [ariaLabel]="isMenuOpen ? 'Fermer le menu' : 'Ouvrir le menu'">

        @if (!isMenuOpen) {
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        } @else {
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
        }
    </button>
</header>
