@if (config) {
<div class="min-h-screen flex flex-col bg-[#FAF9F6] font-sans antialiased text-[#2C2A29] relative">

  <header
    class="bg-[#FAF9F6]/80 backdrop-blur-md shadow-sm border-b border-stone-200/50 fixed top-0 left-0 right-0 z-40 px-6 h-20 flex items-center justify-between">
    <div class="w-11 hidden md:block"></div>

    <h1 class="text-3xl md:text-5xl font-serif font-semibold tracking-wide text-center mx-auto text-[#E23D28]">
      {{ config.title }}
    </h1>

    <button (click)="toggleMenu()"
      class="text-gray-700 hover:text-[#E23D28] focus:outline-none z-50 p-2 transition-colors">
      @if (!isMenuOpen) {
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      } @else {
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
      }
    </button>
  </header>

  <app-sidebar [isMenuOpen]="isMenuOpen" [menuTree]="menuTree" [activeSection]="activeSection"
    (closeMenu)="toggleMenu()" (sectionSelected)="selectSection($event)">
  </app-sidebar>

  <main class="flex-grow pt-20">
    @if (activeSection) {
    <div>
      <div class="relative w-full h-56 md:h-80 bg-gray-300 overflow-hidden"
        style="clip-path: polygon(0% 0%, 100% 0%, 100% 80%, 0% 100%);">

        @if (isImageLoading) {
        <div class="absolute z-10 flex flex-col items-center gap-2">
          <!-- Petit spinner fluide couleur rouge Poppy -->
          <div class="w-8 h-8 border-2 border-[#E23D28]/20 border-t-[#E23D28] rounded-full animate-spin"></div>
        </div>
        }
        <img [src]="activeSection.banner_image" (load)="onImageLoad()"
          class="absolute inset-0 w-full h-full object-cover transition-opacity duration-300"
          [ngClass]="isImageLoading ? 'opacity-0' : 'opacity-100'" />
        <div class="absolute inset-0 bg-black/10"></div>
      </div>

      <div class="px-4 pb-12">
        @for (info of activeSection.informations; track $index) {
        <app-information [info]="info"></app-information>
        }
      </div>
    </div>
    }
  </main>

  <app-footer [config]="config"></app-footer>

</div>
}
